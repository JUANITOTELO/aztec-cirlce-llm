[project]
name = "aztec-circle-llm"
version = "0.2.0"
description = "Production Multi-Generational LLM Debate Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "litellm>=1.40.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  "websockets>=12.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "aiosqlite>=0.20.0",
  "tenacity>=8.3.0",
  "structlog>=24.1.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "prompt_toolkit>=3.0.43",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.14",
  "pytest-cov>=5.0",
]

[project.scripts]
aztec = "aztec_circle.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aztec_circle*"]

[tool.setuptools.package-data]
"aztec_circle" = [
  "prompts/*.txt",
  "server/static/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:.*StarletteDeprecationWarning.*",
    "ignore:.*httpx.*:UserWarning",
]


